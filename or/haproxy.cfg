global
    maxconn 1000
 
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s
 
defaults
    mode tcp
    retries 2
    timeout client 30m
    timeout connect 4s
    timeout server 30m
    timeout check 5s
 
listen stats
    mode http
    bind 0.0.0.0:7000
    stats enable
    stats uri /
    stats refresh 2s
 
frontend pg_cluster_write
    bind 0.0.0.0:5000
    default_backend pg_cluster_primary
 
backend pg_cluster_primary
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr libc,none
    server pg-patroni-1 pg-patroni-1:5432 maxconn 100 check port 8008
    server pg-patroni-2 pg-patroni-2:5432 maxconn 100 check port 8008
 
frontend pg_cluster_read
    bind 0.0.0.0:5001
    default_backend pg_cluster_replica
 
backend pg_cluster_replica
    balance roundrobin
    option httpchk GET /replica?lag=1MB
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 resolvers docker init-addr libc,none
    server pg-patroni-1 pg-patroni-1:5432 maxconn 100 check port 8008
    server pg-patroni-2 pg-patroni-2:5432 maxconn 100 check port 8008
