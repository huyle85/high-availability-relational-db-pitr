[global]
repo1-type=s3
repo1-s3-endpoint=minio
repo1-storage-port=9000
repo1-s3-bucket=pg-backup
repo1-s3-key=minioadmin
repo1-s3-key-secret=minioadmin
repo1-s3-region=us-east-1
repo1-s3-uri-style=path
repo1-storage-ca-file=/certs/public.crt
repo1-path=/repo
repo1-retention-full=2
repo1-retention-full-type=count
compress-type=lz4
process-max=2
start-fast=y
archive-async=y
spool-path=/var/spool/pgbackrest
log-level-console=info
log-level-file=detail
 
[demo]
pg1-path=/var/lib/postgresql/data/patroni
pg1-user=postgres
pg1-socket-path=/var/run/postgresql
